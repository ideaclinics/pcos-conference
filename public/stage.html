<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Stage · PMOS live questions</title>
<style>
  :root{--ink:#1B1B2F;--muted:#55556A;--line:#EADFD0;--accent:#F15738;--tint:#FFEDE6}
  *{box-sizing:border-box} body{margin:0;font-family:Poppins,system-ui,Arial,sans-serif;background:#fff;color:var(--ink)}
  header{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-bottom:2px solid var(--line)}
  h1{font-size:1rem;margin:0;color:var(--muted)} .meta{font-size:.8rem;color:var(--muted)}
  main{padding:18px 20px;max-width:1100px;margin:0 auto}
  .card{border:2px solid var(--line);border-radius:18px;padding:18px 22px;margin-bottom:14px;display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
  .card.next{border-color:var(--accent);background:var(--tint)}
  .card p{margin:6px 0 0;font-size:1.5rem;line-height:1.35;font-weight:500}
  .card.next p{font-size:2.2rem;font-weight:600}
  .tag{display:inline-block;font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 12px;background:var(--accent);color:#fff}
  .lab{font-size:.8rem;font-weight:600;letter-spacing:.02em;color:var(--muted);margin:0 0 10px}
  button{font:inherit;font-size:.9rem;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:10px 18px;cursor:pointer;white-space:nowrap}
  .empty{font-size:1.4rem;color:var(--muted);text-align:center;padding:80px 0}
  #login{max-width:360px;margin:80px auto;padding:0 16px} input{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
</style>
</head>
<body>
<div id="login" hidden><h1>Stage login</h1><input id="tok" type="password" placeholder="Stage password"><p id="lerr" class="meta" style="color:#C23A1B"></p><button id="loginBtn">Open</button></div>
<div id="app" hidden>
  <header><h1>Questions for the stage</h1><span class="meta" id="sync"></span></header>
  <main id="list"></main>
</div>
<script>
(function(){
  var tok = sessionStorage.getItem('stk') || '';
  var m = location.hash.match(/key=([^&]+)/); if (m) { tok = decodeURIComponent(m[1]); sessionStorage.setItem('stk', tok); history.replaceState(null,'',location.pathname); }
  var $ = function(i){return document.getElementById(i);};
  var seg = location.pathname.replace(/\/+$/,'').split('/').pop();
  var LOCK = (seg==='pmos' || seg==='diabetes') ? seg : null;
  if (LOCK) { document.querySelector('header h1').textContent = (LOCK==='pmos' ? 'PMOS' : 'Diabetes') + ' webinar · questions for the stage'; document.title = 'Stage · ' + (LOCK==='pmos' ? 'PMOS' : 'Diabetes'); }
  function api(path, body){
    return fetch(path, {method: body ? 'POST' : 'GET', headers: {'Authorization':'Bearer '+tok,'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined})
      .then(function(r){ if (r.status===401) throw new Error('auth'); return r.json(); });
  }
  function load(){
    api('/api/stage/questions').then(function(d){
      $('login').hidden=true; $('app').hidden=false;
      var box = $('list'); box.textContent='';
      var rows = (d.rows||[]).filter(function(r){ return !LOCK || r.hall===LOCK; });
      if (!rows.length) { var e=document.createElement('div'); e.className='empty'; e.textContent='No approved questions yet.'; box.appendChild(e); }
      rows.forEach(function(r,i){
        if (i===0) { var l=document.createElement('p'); l.className='lab'; l.textContent='NEXT QUESTION'; box.appendChild(l); }
        if (i===1) { var l2=document.createElement('p'); l2.className='lab'; l2.textContent='QUEUE'; box.appendChild(l2); }
        var c=document.createElement('div'); c.className='card'+(i===0?' next':'');
        var left=document.createElement('div');
        if (!LOCK) { var t=document.createElement('span'); t.className='tag'; t.textContent=(r.hall==='pmos'?'PMOS':'Diabetes'); left.appendChild(t); }
        if (r.name) { var n=document.createElement('span'); n.className='meta'; n.style.marginLeft='10px'; n.textContent=r.name; left.appendChild(n); }
        var p=document.createElement('p'); p.textContent=r.question; left.appendChild(p);
        var b=document.createElement('button'); b.textContent='Asked'; b.onclick=function(){ api('/api/stage/asked',{id:r.id}).then(load); };
        c.appendChild(left); c.appendChild(b); box.appendChild(c);
      });
      $('sync').textContent='Updated '+new Date().toLocaleTimeString('en-IN');
    }).catch(function(e){ if (e.message==='auth') { sessionStorage.removeItem('stk'); $('app').hidden=true; $('login').hidden=false; $('lerr').textContent = tok ? 'Wrong password.' : ''; } else { $('sync').textContent='Offline, retrying…'; } });
  }
  $('loginBtn').onclick=function(){ tok=$('tok').value.trim(); sessionStorage.setItem('stk',tok); load(); };
  $('tok').addEventListener('keydown',function(e){ if(e.key==='Enter') $('loginBtn').click(); });
  if (tok) load(); else $('login').hidden=false;
  setInterval(function(){ if (tok && !$('app').hidden) load(); }, 3000);
})();
</script>
</body>
</html>
